# MetaTrader 5 mode: everything runs in Docker except the broker, which runs
# natively on Windows next to the MT5 terminal (scripts/windows/mt5-broker.bat).
#
#   docker compose --env-file config/.env.shared -f docker-compose.yml -f docker-compose.mt5.yml up -d --build
#
# Requires Docker Compose 2.24.4 or newer (for !override).
x-host-broker: &host-broker
  BROKER_SERVICE_HOST: host.docker.internal
  BROKER_SERVICE_BASE_URL: http://host.docker.internal:8050

services:
  broker-service:
    # The cTrader broker container is not started in MT5 mode.
    profiles: ["ctrader"]

  ingestion-service:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *host-broker
    depends_on: !override
      database-accessor-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  webserver:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *host-broker
    depends_on: !override
      redis:
        condition: service_healthy

  frontend:
    # Come back with the rest of the stack after a reboot.
    restart: always
