# MetaTrader 5 mode: everything runs in Docker except the broker, which runs
# natively on Windows next to the MT5 terminal (scripts/windows/mt5-broker.bat).
#
#   docker compose --env-file config/.env.shared -f docker-compose.yml -f docker-compose.mt5.yml up -d --build
#
# Requires Docker Compose 2.24.4 or newer (for !override).
x-host-broker: &host-broker
  BROKER_SERVICE_HOST: host.docker.internal
  BROKER_SERVICE_BASE_URL: http://host.docker.internal:8050

services:
  broker-service:
    # The cTrader broker container is not started in MT5 mode.
    profiles: ["ctrader"]

  ingestion-service:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *host-broker
    depends_on: !override
      database-accessor-api:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  webserver:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *host-broker
    depends_on: !override
      redis:
        condition: service_healthy

  frontend:
    # Come back with the rest of the stack after a reboot.
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Pick up code changes after a git pull (Windows doesn't send file events).
      VITE_USE_POLLING: "true"
      # Contract sizes (tick value) for the risk-to-reward tool come from the MT5 bridge.
      VITE_PROXY_BROKER_TARGET: http://host.docker.internal:8050

  lab:
    # The Lab: the Researcher and Trader agents (lab/README.md). Capped so it never slows
    # the charts or MT5: 1 CPU core, 1 GB, low priority. Comes back after a reboot.
    container_name: lab
    build:
      context: .
      dockerfile: lab/Dockerfile
    volumes:
      - ./lab:/lab
    cpus: 1.0
    mem_limit: 1g
    cpu_shares: 256
    restart: unless-stopped
    depends_on:
      database-accessor-api:
        condition: service_healthy


  dom-service:
    # Memory DOM: NinjaTrader's AlgoTraderDomBridge streams its DOM here (TCP 8060 on this
    # PC); the chart's DOM panel reads it through the frontend. Remembers pulled / filled /
    # held orders and how price reacted (dom-memory/dom_memory.sqlite).
    container_name: dom-service
    build:
      context: .
      dockerfile: dom-service/Dockerfile
    ports:
      - "127.0.0.1:8060:8060"
    volumes:
      - ./dom-memory:/data
    mem_limit: 512m
    restart: unless-stopped

  hyperliquid-service:
    # Read-only: copies Hyperliquid trade.xyz XYZ100 / SP500 1-minute candles into the database
    # (exchange HYPERLIQUID) and compares them with NQ / ES. No keys, no orders.
    container_name: hyperliquid-service
    build:
      context: .
      dockerfile: hyperliquid-service/Dockerfile
    environment:
      DATA_ACCESSOR_URL: http://database-accessor-api:8000
      HL_COINS: "xyz:XYZ100=XYZ100>NQ, xyz:SP500=SP500>ES"
    ports:
      - "127.0.0.1:8040:8040"
    depends_on:
      database-accessor-api:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
